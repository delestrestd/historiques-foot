<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Historiques Foot — Confrontations directes</title>
  <style>
    :root {
      --bg: #0b1220; --bg2: #121a2b; --card: #162033; --card2: #1a2740;
      --border: #243047; --text: #e8eef9; --muted: #8b9bb8;
      --accent: #3dd68c; --accent2: #2bb673; --danger: #ff5c7a;
      --warn: #f5c542; --info: #5b9dff; --radius: 14px;
      --shadow: 0 8px 28px rgba(0,0,0,.35);
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Ubuntu, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: var(--font);
      background: radial-gradient(1200px 600px at 50% -10%, #1a2a4a 0%, var(--bg) 55%);
      color: var(--text); min-height: 100vh; line-height: 1.45;
    }
    a { color: var(--info); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 48px; }
    header { text-align: center; padding: 28px 8px 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(61,214,140,.12); color: var(--accent);
      border: 1px solid rgba(61,214,140,.35); padding: 4px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 600;
      letter-spacing: .02em; margin-bottom: 12px;
    }
    .badge.live {
      background: rgba(91,157,255,.12); color: var(--info);
      border-color: rgba(91,157,255,.4);
    }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; letter-spacing: -.02em; }
    .subtitle { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
    .search-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px); padding: 16px; box-shadow: var(--shadow);
    }
    .dual-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
    .field-wrap { position: relative; min-width: 0; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
    }
    .field-wrap input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 16px; outline: none;
    }
    .field-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,214,140,.15); }
    .field-wrap input::placeholder { color: #667894; }
    .vs-sep { align-self: end; padding-bottom: 14px; color: var(--muted); font-weight: 800; font-size: .85rem; letter-spacing: .06em; }
    .ac-list {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); z-index: 40; max-height: 240px; overflow-y: auto; display: none;
    }
    .ac-list.open { display: block; }
    .ac-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      width: 100%; padding: 10px 12px; border: none; background: transparent;
      color: inherit; font: inherit; text-align: left; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: rgba(61,214,140,.1); }
    .ac-item .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .ac-item .live-tag {
      font-size: 10px; font-weight: 700; color: var(--info);
      background: rgba(91,157,255,.15); padding: 2px 6px; border-radius: 6px;
    }
    .btn-row { margin-top: 12px; }
    button.primary {
      width: 100%; background: linear-gradient(180deg, var(--accent), var(--accent2));
      color: #062515; border: none; border-radius: 12px; padding: 15px 18px;
      font-weight: 800; font-size: 16px; cursor: pointer; letter-spacing: .01em;
    }
    button.primary:hover { filter: brightness(1.05); }
    button.primary:active { transform: scale(.98); }
    .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; justify-content: center; }
    .chip {
      background: var(--bg2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: .15s ease;
    }
    .chip:hover, .chip:focus { color: var(--text); border-color: var(--accent); outline: none; }
    .status { text-align: center; color: var(--muted); margin: 18px 0 8px; min-height: 1.4em; font-size: .92rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--accent); }
    .loader {
      display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: -2px; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-top: 14px; box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 12px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .vs { color: var(--muted); font-weight: 600; font-size: .9rem; }
    .tag {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .tag.demo { color: var(--warn); border-color: rgba(245,197,66,.35); background: rgba(245,197,66,.08); }
    .tag.live { color: var(--info); border-color: rgba(91,157,255,.4); background: rgba(91,157,255,.1); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat {
      background: var(--bg2); border-radius: 12px; padding: 12px 8px;
      text-align: center; border: 1px solid var(--border);
    }
    .stat .n { font-size: 1.45rem; font-weight: 800; line-height: 1.1; }
    .stat .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .stat.win .n { color: var(--accent); }
    .stat.draw .n { color: var(--warn); }
    .stat.loss .n { color: var(--danger); }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .team-form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 200px; }
    .team-name { font-weight: 700; font-size: .95rem; }
    .pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .pill {
      width: 26px; height: 26px; border-radius: 7px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
    }
    .pill.W { background: rgba(61,214,140,.2); color: var(--accent); }
    .pill.D { background: rgba(245,197,66,.18); color: var(--warn); }
    .pill.L { background: rgba(255,92,122,.2); color: var(--danger); }
    table.h2h { width: 100%; border-collapse: collapse; font-size: .88rem; }
    table.h2h th, table.h2h td {
      padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    table.h2h th {
      color: var(--muted); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    table.h2h tr:last-child td { border-bottom: none; }
    table.h2h tr:hover td { background: rgba(255,255,255,.02); }
    .score { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .comp { color: var(--muted); font-size: .8rem; }
    .venue {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 6px; background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
    }
    .venue.home { color: var(--info); border-color: rgba(91,157,255,.35); }
    .venue.away { color: #c4a0ff; border-color: rgba(196,160,255,.35); }
    .suggest-list { display: grid; gap: 8px; }
    .suggest-item {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; cursor: pointer; text-align: left; color: inherit; width: 100%; font: inherit;
    }
    .suggest-item:hover { border-color: var(--accent); background: var(--card2); }
    .suggest-item .meta { color: var(--muted); font-size: .8rem; }
    .team-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .team-tile {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit;
    }
    .team-tile:hover { border-color: var(--accent); }
    .team-tile strong { display: block; font-size: .92rem; }
    .team-tile span { color: var(--muted); font-size: 11px; }
    footer {
      text-align: center; color: var(--muted); font-size: 12px;
      margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
    .empty strong { color: var(--text); display: block; margin-bottom: 6px; }
    @media (max-width: 640px) {
      .dual-row { grid-template-columns: 1fr; gap: 12px; }
      .vs-sep { display: none; }
      table.h2h .hide-sm { display: none; }
      .stats-grid { gap: 6px; }
      .stat .n { font-size: 1.25rem; }
    }
  </style>
</head>

            <input id="teamA" type="search" enterkeyhint="next" placeholder="ex. Lyon, PSG" aria-label="Équipe A" aria-autocomplete="list" aria-controls="acA" />
            <div class="ac-list" id="acA" role="listbox"></div>
          </div>
          <div class="vs-sep">VS</div>
          <div class="field-wrap">
            <label class="field-label" for="teamB">Équipe B (adversaire)</label>
            <input id="teamB" type="search" enterkeyhint="search" placeholder="ex. Anderlecht, OM" aria-label="Équipe B adversaire" aria-autocomplete="list" aria-controls="acB" />
            <div class="ac-list" id="acB" role="listbox"></div>
          </div>
        </div>
        <div class="btn-row">
          <button class="primary" type="submit">Voir l’historique</button>
        </div>
      </form>
      <div class="hints" id="hints"></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <main id="results"></main>
    <footer>
      Historiques Foot · outil fraternel, pas un site de paris
      <br />Données démo locales + aperçu live TheSportsDB (sans clé API)

  </div>

const TEAM_IDS = new Set(TEAMS.map(t => t.id));
const VALID_MATCHES = MATCHES.filter(m => TEAM_IDS.has(m.home) && TEAM_IDS.has(m.away));
const DERBIES = [
  { a: "PSG", b: "OM", label: "PSG vs OM" },
  { a: "Real", b: "Barça", label: "Real – Barça" },
  { a: "Man Utd", b: "Man City", label: "United vs City" },
  { a: "Bayern", b: "Dortmund", label: "Bayern – Dortmund" },
  { a: "Lille", b: "Lens", label: "Lille vs Lens" },

  { a: "Lyon", b: "Anderlecht", label: "Lyon – Anderlecht" },
  { a: "Union SG", b: "Liverpool", label: "Union SG – Liverpool" },
];
const TSDB = "https://www.thesportsdb.com/api/v1/json/3";

const $ = (sel) => document.querySelector(sel);
const norm = (s) => (s || "")
  .toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/['’]/g, " ")
  .replace(/[^a-z0-9\s]/g, " ")
  .replace(/\s+/g, " ")
  .trim();

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function teamById(id) { return TEAMS.find(t => t.id === id); }
function teamKeys(t) { return [t.name, t.short, ...(t.aliases || [])].map(norm); }

function scoreTeam(query, t) {
  const q = norm(query);
  if (!q) return 0;
  const keys = teamKeys(t);
  if (keys.includes(q)) return 100;
  if (keys.some(k => k.startsWith(q))) return 80;
  if (keys.some(k => k.includes(q))) return 60;
  const qTokens = q.split(" ");
  let best = 0;
  for (const k of keys) {
    const kt = k.split(" ");
    const hit = qTokens.filter(tok => kt.some(x => x.startsWith(tok) || tok.startsWith(x))).length;
    if (hit) best = Math.max(best, 30 + hit * 15);
  }
  return best;
}
function matchTeam(query) {
  const q = norm(query);
  if (!q) return null;
  let best = null, bestScore = 0;
  for (const t of TEAMS) {
    const s = scoreTeam(q, t);
    if (s > bestScore) { bestScore = s; best = t; }
  }
  return bestScore >= 30 ? best : null;
}
function suggestLocal(query, limit = 8) {
  const q = norm(query);
  if (!q) return [];
  return TEAMS.map(t => ({ t, s: scoreTeam(q, t) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || a.t.name.localeCompare(b.t.name))
    .slice(0, limit).map(x => x.t);
}
function closestTeams(query, limit = 8) {
  const q = norm(query);
  const scored = TEAMS.map(t => ({ t, s: scoreTeam(q, t) })).sort((a, b) => b.s - a.s);
  const good = scored.filter(x => x.s > 0).slice(0, limit);
  return (good.length ? good : scored.slice(0, limit)).map(x => x.t);
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
  if (!y) return iso;
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("fr-FR", { day:"2-digit", month:"short", year:"numeric", timeZone:"UTC" });
}
function resultFor(teamId, m) {
  const isHome = m.home === teamId;
  const gf = isHome ? m.hg : m.ag, ga = isHome ? m.ag : m.hg;
  return gf > ga ? "W" : gf < ga ? "L" : "D";
}
function recentForm(teamId, n = 5, matches = VALID_MATCHES) {
  return matches.filter(m => m.home === teamId || m.away === teamId)
    .slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))
    .slice(0, n).map(m => resultFor(teamId, m));
}
function h2hMatches(aId, bId) {
  return VALID_MATCHES.filter(m =>
    (m.home === aId && m.away === bId) || (m.home === bId && m.away === aId)
  ).slice().sort((a, b) => b.date.localeCompare(a.date));
}
function opponentsOf(teamId) {
  const map = new Map();
  for (const m of VALID_MATCHES) {
    let opp = null;
    if (m.home === teamId) opp = m.away;
    else if (m.away === teamId) opp = m.home;
    if (!opp) continue;
    map.set(opp, (map.get(opp) || 0) + 1);
  }
  return [...map.entries()].sort((a, b) => b[1] - a[1])
    .map(([id, count]) => ({ team: teamById(id), count })).filter(x => x.team);
}
function pillsHtml(form) {
  if (!form.length) return `<span class="meta">Pas assez de matchs</span>`;
  return `<div class="pills">${form.map(r =>
    `<span class="pill ${r}" title="${r==="W"?"Victoire":r==="D"?"Nul":"Défaite"}">${r}</span>`
  ).join("")}</div>`;
}

async function fetchJson(url, ms = 5000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
async function liveSearchTeams(name) {
  try {
    const data = await fetchJson(`${TSDB}/searchteams.php?t=${encodeURIComponent(name)}`);
    return ((data && data.teams) || [])
      .filter(t => (t.strSport || "").toLowerCase() === "soccer")
      .slice(0, 8)
      .map(t => ({
        id: "live_" + t.idTeam, liveId: t.idTeam, name: t.strTeam,
        short: t.strTeamShort || t.strTeam, country: t.strCountry || "—",
        league: t.strLeague || "—", live: true,
      }));
  } catch (_) { return null; }
}
async function liveTeamEvents(teamId) {
  try {
    const data = await fetchJson(`${TSDB}/eventslast.php?id=${encodeURIComponent(teamId)}`);
    return (data && data.results) || [];
  } catch (_) { return []; }
}
function eventToMatch(ev, aName, bName) {
  const home = ev.strHomeTeam || "", away = ev.strAwayTeam || "";
  const hn = norm(home), an = norm(away), a = norm(aName), b = norm(bName);
  const involves =
    (hn.includes(a) || a.includes(hn) || hn.includes(b) || b.includes(hn)) &&
    (an.includes(a) || a.includes(an) || an.includes(b) || b.includes(an));
  if (!involves) return null;
  const hg = parseInt(ev.intHomeScore, 10), ag = parseInt(ev.intAwayScore, 10);
  if (Number.isNaN(hg) || Number.isNaN(ag)) return null;
  const homeIsA = hn.includes(a) || a.includes(hn);
  return {
    home: homeIsA ? "A" : "B", away: homeIsA ? "B" : "A",
    homeName: home, awayName: away, hg, ag,
    date: (ev.dateEvent || "").slice(0, 10),
    competition: ev.strLeague || ev.strEvent || "Live", live: true,
  };
}
async function buildLiveH2H(teamA, teamB) {
  let liveA = teamA.liveId ? teamA : null;
  let liveB = teamB.liveId ? teamB : null;
  if (!liveA) { const f = await liveSearchTeams(teamA.name || teamA.short); if (f && f.length) liveA = f[0]; }
  if (!liveB) { const f = await liveSearchTeams(teamB.name || teamB.short); if (f && f.length) liveB = f[0]; }
  if (!liveA || !liveB) return { matches: [], formA: [], formB: [], liveA, liveB };
  const [evA, evB] = await Promise.all([liveTeamEvents(liveA.liveId), liveTeamEvents(liveB.liveId)]);
  const aName = liveA.name, bName = liveB.name;
  const seen = new Set(), matches = [];
  for (const ev of [...evA, ...evB]) {
    const key = ev.idEvent || (ev.dateEvent + ev.strHomeTeam + ev.strAwayTeam);
    if (seen.has(key)) continue;
    seen.add(key);
    const m = eventToMatch(ev, aName, bName);
    if (m) matches.push(m);
  }
  matches.sort((x, y) => String(y.date).localeCompare(String(x.date)));
  const formFrom = (events, name) => events.slice(0, 5).map(ev => {
    const isHome = norm(ev.strHomeTeam||"").includes(norm(name)) || norm(name).includes(norm(ev.strHomeTeam||""));
    const hg = parseInt(ev.intHomeScore, 10), ag = parseInt(ev.intAwayScore, 10);
    if (Number.isNaN(hg) || Number.isNaN(ag)) return null;
    const gf = isHome ? hg : ag, ga = isHome ? ag : hg;
    return gf > ga ? "W" : gf < ga ? "L" : "D";
  }).filter(Boolean);
  return { matches, formA: formFrom(evA, aName), formB: formFrom(evB, bName), liveA, liveB };
}

  const form = recentForm(team.id);

const acState = { A: { items: [], idx: -1, timer: null }, B: { items: [], idx: -1, timer: null } };
function closeAc(side) {
  const list = $(side === "A" ? "#acA" : "#acB");
  list.classList.remove("open"); list.innerHTML = "";
  acState[side].items = []; acState[side].idx = -1;
}
function renderAc(side, items) {
  const list = $(side === "A" ? "#acA" : "#acB");
  acState[side].items = items; acState[side].idx = -1;
  if (!items.length) { closeAc(side); return; }
  list.innerHTML = items.map((t, i) => `
    <button type="button" class="ac-item" role="option" data-i="${i}">
      <span><strong>${escapeHtml(t.short||t.name)}</strong> · ${escapeHtml(t.name)}</span>
      <span class="meta">${t.live?`<span class="live-tag">Live</span> `:""}${escapeHtml(t.league||"")}</span>
    </button>`).join("");
  list.classList.add("open");
  list.querySelectorAll(".ac-item").forEach(btn => {
    btn.addEventListener("mousedown", (e) => { e.preventDefault(); pickAc(side, items[+btn.dataset.i]); });
  });
}
function pickAc(side, team) {
  const input = $(side === "A" ? "#teamA" : "#teamB");
  input.value = team.short || team.name;
  closeAc(side);
}
async function onType(side) {
  const input = $(side === "A" ? "#teamA" : "#teamB");
  const q = input.value.trim();
  if (acState[side].timer) clearTimeout(acState[side].timer);
  if (!q) { closeAc(side); return; }
  const local = suggestLocal(q, 6);
  renderAc(side, local);
  acState[side].timer = setTimeout(async () => {
    if (input.value.trim() !== q) return;
    const live = await liveSearchTeams(q);
    if (input.value.trim() !== q || !live) return;
    const seen = new Set(local.map(t => norm(t.name)));
    const merged = [...local];
    for (const t of live) {
      if (!seen.has(norm(t.name))) { seen.add(norm(t.name)); merged.push(t); }
      if (merged.length >= 8) break;
    }
    renderAc(side, merged);
  }, 320);
}
function bindAcKeyboard(side) {
  const input = $(side === "A" ? "#teamA" : "#teamB");
  input.addEventListener("keydown", (e) => {
    const st = acState[side];
    if (!st.items.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); st.idx = Math.min(st.idx + 1, st.items.length - 1); highlightAc(side); }
    else if (e.key === "ArrowUp") { e.preventDefault(); st.idx = Math.max(st.idx - 1, 0); highlightAc(side); }
    else if (e.key === "Enter" && st.idx >= 0) { e.preventDefault(); pickAc(side, st.items[st.idx]); }
    else if (e.key === "Escape") closeAc(side);
  });
}
function highlightAc(side) {
  $(side === "A" ? "#acA" : "#acB").querySelectorAll(".ac-item").forEach((el, i) => {
    el.classList.toggle("active", i === acState[side].idx);
  });
}

async function runSearch() {
  closeAc("A"); closeAc("B");
  const rawA = $("#teamA").value.trim();
  const rawB = $("#teamB").value.trim();
  const results = $("#results");
  if (!rawA && !rawB) {
    setStatus("Saisis au moins Équipe A (ex. Lyon) ou un derby.");
    results.innerHTML = renderWelcome(); bindResultActions(); return;
  }
  const qA = rawA || rawB;
  const qB = rawA ? rawB : "";
  setStatus(`<span class="loader"></span>Recherche en cours…`);
  results.innerHTML = "";
  await new Promise(r => setTimeout(r, 80));

  let teamA = matchTeam(qA);
  let teamB = qB ? matchTeam(qB) : null;

  if (teamA && !qB) {
    setStatus(`Équipe : ${teamA.name} · Mode démo`, "ok");
    updateModeBadge("demo");
    results.innerHTML = renderTeam(teamA); bindResultActions(); return;
  }
  if (!teamA) {
    const close = closestTeams(qA, 8);
    setStatus(`« ${qA} » introuvable — suggestions ci-dessous`, "error");
    updateModeBadge("demo");
    results.innerHTML = renderClosest(qA, close, "a");
    const live = await liveSearchTeams(qA);
    if (live && live.length) {
      results.innerHTML += `<section class="card"><h2>Suggestions Live</h2><div class="team-card-grid">${
        live.map(t => `<button type="button" class="team-tile" data-pick-a="${escapeHtml(t.name)}"><strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(t.league)} · Live</span></button>`).join("")
      }</div></section>`;
      updateModeBadge("mixed");
    }
    bindResultActions(); return;
  }
  if (qB && !teamB) {
    const close = closestTeams(qB, 8);
    setStatus(`Adversaire « ${qB} » introuvable — choisis une suggestion`, "error");
    results.innerHTML = renderTeam(teamA) + renderClosest(qB, close, "b");
    const live = await liveSearchTeams(qB);
    if (live && live.length) {
      results.innerHTML += `<section class="card"><h2>Suggestions Live (adversaire)</h2><div class="team-card-grid">${
        live.map(t => `<button type="button" class="team-tile" data-pick-b="${escapeHtml(t.name)}"><strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(t.league)} · Live</span></button>`).join("")
      }</div></section>`;
      updateModeBadge("mixed");
    } else updateModeBadge("demo");
    bindResultActions(); return;
  }

  let matches = h2hMatches(teamA.id, teamB.id);
  if (matches.length) {
    setStatus(`${matches.length} confrontation(s) · Mode démo`, "ok");
    updateModeBadge("demo");
    results.innerHTML = renderH2H(teamA, teamB, matches, { source: "demo" });
    bindResultActions(); return;
  }

  setStatus(`<span class="loader"></span>Pas de H2H en démo — recherche Live…`);
  updateModeBadge("live");
  try {
    const live = await buildLiveH2H(teamA, teamB);
    if (live.matches && live.matches.length) {
      const dispA = { ...teamA, name: live.liveA?.name || teamA.name };
      const dispB = { ...teamB, name: live.liveB?.name || teamB.name };
      setStatus(`${live.matches.length} confrontation(s) Live`, "ok");
      results.innerHTML = renderH2H(dispA, dispB, live.matches, { source: "live", formA: live.formA, formB: live.formB });
      bindResultActions(); return;
    }
    setStatus("Aucun H2H récent en Live — suggestions d’adversaires", "error");
    results.innerHTML = `<section class="card"><div class="empty"><strong>Pas de confrontations trouvées</strong>
      ${escapeHtml(teamA.name)} vs ${escapeHtml(teamB.name)} — ni en démo, ni dans les derniers matchs Live.</div></section>` + renderTeam(teamA);
    updateModeBadge(live.liveA || live.liveB ? "mixed" : "demo");
    bindResultActions();
  } catch (err) {
    setStatus("Live indisponible (réseau / CORS / limite API) — mode démo uniquement", "error");
    updateModeBadge("demo");
    results.innerHTML = `<section class="card"><div class="empty"><strong>H2H introuvable en démo</strong>
      Tentative Live échouée. Voici la fiche de ${escapeHtml(teamA.short)}.</div></section>` + renderTeam(teamA);
    bindResultActions();
  }
}

function fillBoth(a, b) {
  $("#teamA").value = a || "";
  $("#teamB").value = b || "";
  runSearch();
}
function bindResultActions() {
  document.querySelectorAll("[data-fill-a]").forEach(btn => {
    btn.addEventListener("click", () => fillBoth(btn.getAttribute("data-fill-a"), btn.getAttribute("data-fill-b") || ""));
  });
  document.querySelectorAll("[data-pick-a]").forEach(btn => {
    btn.addEventListener("click", () => { $("#teamA").value = btn.getAttribute("data-pick-a"); runSearch(); });
  });
  document.querySelectorAll("[data-pick-b]").forEach(btn => {
    btn.addEventListener("click", () => { $("#teamB").value = btn.getAttribute("data-pick-b"); runSearch(); });
  });
}
function initHints() {
  const box = $("#hints");
  box.innerHTML = DERBIES.map(d =>
    `<button type="button" class="chip" data-a="${escapeHtml(d.a)}" data-b="${escapeHtml(d.b)}">${escapeHtml(d.label)}</button>`
  ).join("");
  box.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => fillBoth(chip.getAttribute("data-a"), chip.getAttribute("data-b")));
  });
}

$("#searchForm").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
$("#teamA").addEventListener("input", () => onType("A"));
$("#teamB").addEventListener("input", () => onType("B"));
$("#teamA").addEventListener("blur", () => setTimeout(() => closeAc("A"), 150));
$("#teamB").addEventListener("blur", () => setTimeout(() => closeAc("B"), 150));
bindAcKeyboard("A"); bindAcKeyboard("B");
document.addEventListener("click", (e) => { if (!e.target.closest(".field-wrap")) { closeAc("A"); closeAc("B"); } });
initHints();
$("#results").innerHTML = renderWelcome();
bindResultActions();
setStatus(`${TEAMS.length} équipes · ${VALID_MATCHES.length} matchs en base démo`);
updateModeBadge("demo");

</script>
</body>
</html>
